# 允许非 ASCII 项目路径（中文 Windows 用户目录常见）
android.overridePathCheck=true

# JVM 参数
# 注意：file.encoding 必须用 GBK——Gradle 8.13 通过 java @argfile 传递测试 worker 的
# classpath，daemon 按 file.encoding 写入、JDK 启动器按系统编码(GBK)读取；UTF-8 写入
# 会让中文路径乱码 → 测试类 ClassNotFoundException。GBK 两端一致后中文路径正常。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX（仅使用系统内置组件，无第三方库）
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 代码风格
kotlin.code.style=official
